version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xo76
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
  app:
    build: .
    command: ["sh", "-c", "npm install -g pnpm && pnpm dev"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/xo76
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      INSTAGRAM_CHECKOUT_URL: https://instagram.com/your-handle
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
